<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不动声色 的小站</title>
    <link rel="stylesheet" href="./styles/homepage/style.css">
    <!-- <link rel="stylesheet" href="./styles/kanban/kanban.css"> -->
</head>
<body>

<canvas id="sakura"></canvas>
<audio id="bgm" loop preload="auto"></audio>
<div class="music-control" onclick="toggleMusic()">🎵</div>

<div class="hero-banner">
    <div class="banner-text">
        <div class="banner-main">無くした日々</div>
        <div class="banner-sub" id="textContainer"></div>
    </div>
    <div class="scroll-down">↓</div>
</div>

<div class="main-container">
    <div class="article-section">
        <h2>最新文章</h2>
        <div id="articleList"></div>
    </div>

    <div class="sidebar-section">
        <div class="widget">
            <div class="widget-avatar"></div>
            <div class="widget-name">保济利亚男神</div>
            <div class="widget-bio">人生苦短</div>
            <div class="widget-stats">
                <div class="stat-item"><div class="stat-num" id="articleCount">0</div><div class="stat-label">文章</div></div>
                <div class="stat-item"><div class="stat-num">1</div><div class="stat-label">标签</div></div>
                <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">分类</div></div>
            </div>
            <div class="widget-links">
                <a href="#" class="link-btn">📺</a>
                <a href="#" class="link-btn">🎵</a>
                <a href="#" class="link-btn">💬</a>
                <a href="#" class="link-btn">🐱</a>
                <a href="#" class="link-btn">✉️</a>
            </div>
        </div>
    </div>
</div>

<!-- <div id="kaban" class="kaban">
    <img src="./images/kanban/cc.png" alt="q版看板">
</div> -->

<script src="main.js"></script>
<script src="./mouseSpecialEffects/mouseStar/mouseStar.js"></script>
<!-- <script src="./kanbanJS/ccKanban.js"></script> -->
</body>
</html>
