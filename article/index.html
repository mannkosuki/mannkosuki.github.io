<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ARTICLE_TITLE}} - 不动声色的小站</title>
    <!-- 看板娘样式 -->
    <link rel="stylesheet" type="text/css" href="../../kanbanJS/new/live2d_demo/assets/waifu.css"/>
    <!-- 通用文章样式 -->
    <link rel="stylesheet" href="../../styles/article/article.css">
<base target="_blank">
</head>

<!-- 看板娘脚本 -->
<script src="../../libJs/jquery.min.js"></script>
<script src="../../kanbanJS/new/live2d_demo/assets/autoload.js"></script>

<body>
    <!-- 看板娘 -->
    <div class="waifu">
        <div class="waifu-tips"></div>
        <canvas id="live2d" class="live2d"></canvas>
        <div class="waifu-tool">
            <span class="fui-home"></span>
            <span class="fui-chat"></span>
            <span class="fui-eye"></span>
            <span class="fui-user"></span>
            <span class="fui-photo"></span>
            <span class="fui-info-circle"></span>
            <span class="fui-cross"></span>
        </div>
    </div>

    <!-- 文章头部 -->
    <header class="article-header">
        <div class="header-bg-img" style="background-image: url('{{HEADER_BG_IMAGE}}');"></div>
        <div class="header-overlay"></div>
        <div class="header-content">
            <h1 class="article-title">{{ARTICLE_TITLE}}</h1>
            <div class="article-meta">
                <span>发表于 {{PUBLISH_DATE}}</span>
                <span class="separator">|</span>
                <span>更新于 {{UPDATE_DATE}}</span>
                <span class="separator">|</span>
                <span>字数总计: {{WORD_COUNT}}</span>
                <span class="separator">|</span>
                <span>阅读时长: {{READ_TIME}}</span>
            </div>
        </div>
    </header>

    <!-- 文章正文 -->
    <div class="article-container">
{{ARTICLE_CONTENT}}
    </div>

    <!-- 看板娘初始化 -->
    <script src="../../kanbanJS/new/live2d_demo/assets/waifu-tips.js"></script>
    <script src="../../kanbanJS/new/live2d_demo/assets/live2d.js"></script>
    <script type="text/javascript">
        live2d_settings['modelId'] = 1;
        live2d_settings['modelTexturesId'] = 87;
        initModel("../../kanbanJS/new/live2d_demo/assets/waifu-tips.json")
    </script>

    <!-- 特效脚本 -->
    <script src="../../Effects/backgroundEffect/sakura.js"></script>
    <script src="../../Effects/mouseSpecialEffects/mouseStar/cursor-meteor.js"></script>

    <!-- 图片错误处理 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('img').forEach(img => {
                const src = img.getAttribute('src');
                if (src && src.includes('cdn.nlark.com')) {
                    img.setAttribute('referrerpolicy', 'no-referrer');
                    img.onerror = function() {
                        this.style.display = 'none';
                        this.insertAdjacentHTML('afterend', '<p class="img-error">⚠️ 图片加载失败，请手动下载并替换为本地路径</p>');
                    };
                }
            });
        });
    </script>
</body>
</html>
